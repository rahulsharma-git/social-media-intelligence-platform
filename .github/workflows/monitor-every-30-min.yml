name: SMI Background Monitor - Every 30 Minutes

on:
  schedule:
    # Primary GitHub scheduler: explicit India Standard Time.
    # Two entries make the half-hour cadence easy to audit.
    - cron: "7 * * * *"
      timezone: "Asia/Kolkata"
    - cron: "37 * * * *"
      timezone: "Asia/Kolkata"

  # Used by manual runs AND by the Supabase Cron fallback bridge.
  workflow_dispatch:
    inputs:
      force_send:
        description: "Send again even if this half-hour slot was already delivered"
        required: false
        default: false
        type: boolean
      trigger_source:
        description: "Scheduler source"
        required: false
        default: "manual"
        type: string

concurrency:
  group: smi-background-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    env:
      TZ: Asia/Kolkata
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
      REPORT_RECIPIENTS_30MIN: ${{ secrets.REPORT_RECIPIENTS_30MIN }}
      REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
      ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
      MONITOR_QUERY: ${{ vars.MONITOR_QUERY }}
      NEGATIVITY_ALERT_THRESHOLD: ${{ vars.NEGATIVITY_ALERT_THRESHOLD }}
      BACKGROUND_LOOKBACK_HOURS: ${{ vars.BACKGROUND_LOOKBACK_HOURS }}
      BACKGROUND_MAX_RECORDS: ${{ vars.BACKGROUND_MAX_RECORDS }}
      FAIL_ON_EMAIL_ERROR: ${{ vars.FAIL_ON_EMAIL_ERROR }}

      # Scheduled/Supabase-triggered runs should NOT force duplicate email.
      FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send || false }}
      TRIGGER_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger_source || 'github-schedule' }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      X_QUERY: ${{ vars.X_QUERY }}
      X_MAX_POSTS: ${{ vars.X_MAX_POSTS }}
      OUTPUT_DIR: output

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Validate required configuration
        shell: bash
        run: |
          set -u
          missing=0

          echo "Trigger source: ${TRIGGER_SOURCE:-unknown}"
          echo "Run started (IST): $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S %Z')"

          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::Missing GitHub Actions repository secret SUPABASE_URL"
            missing=1
          fi

          if [ -z "${SUPABASE_SECRET_KEY:-}" ] && [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo "::error::Add SUPABASE_SECRET_KEY (preferred) or SUPABASE_SERVICE_KEY as a GitHub Actions repository secret"
            missing=1
          fi

          RECIPIENTS="${REPORT_RECIPIENTS_30MIN:-}${REPORT_RECIPIENTS:-}${ALERT_RECIPIENTS:-}"
          if [ -n "$RECIPIENTS" ]; then
            if [ -z "${SMTP_EMAIL:-}" ]; then
              echo "::error::Email recipients are configured but SMTP_EMAIL is missing"
              missing=1
            fi
            if [ -z "${SMTP_APP_PASSWORD:-}" ]; then
              echo "::error::Email recipients are configured but SMTP_APP_PASSWORD is missing"
              missing=1
            fi
          else
            echo "::warning::No email recipients are configured. PDF generation will still run."
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Configuration presence check passed."

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect X posts (optional official X API)
        run: python x_collector.py

      - name: Run browser-independent monitor
        run: python background_monitor.py

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          {
            echo ""
            echo "## Scheduler"
            echo "- Trigger source: **${TRIGGER_SOURCE:-unknown}**"
            echo "- GitHub event: **${GITHUB_EVENT_NAME:-unknown}**"
            echo "- Completed (IST): **$(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S %Z')**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f output/github_step_summary.md ]; then
            cat output/github_step_summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No monitor summary file was created." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve generated report and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smi-report-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 7

    env:
