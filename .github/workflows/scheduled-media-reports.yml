name: DoS-ISRO Build 6.0 V8 Media Reports - 8AM 8PM

on:
  schedule:
    # GitHub cron is UTC. 02:30 UTC = 08:00 IST; 14:30 UTC = 20:00 IST.
    - cron: "30 2 * * *"
    - cron: "30 14 * * *"

  workflow_dispatch:
    inputs:
      edition:
        description: "Edition to generate"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - evening
          - weekly
      report_date:
        description: "Optional IST report date YYYY-MM-DD (blank = today IST)"
        required: false
        default: ""
        type: string
      force_send:
        description: "Resend even if this edition was already emailed"
        required: false
        default: false
        type: boolean

concurrency:
  group: dos-isro-scheduled-media-reports
  cancel-in-progress: false

jobs:
  scheduled-report:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    env:
      TZ: Asia/Kolkata
      OUTPUT_DIR: output
      MASTER_QUERY_FILE: DoS_ISRO_Master_Query_Version_8_0.txt

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}

      # Uses the same email IDs as the hourly monitor by default.
      # REPORT_RECIPIENTS_SCHEDULED is optional and overrides the fallback.
      REPORT_RECIPIENTS_SCHEDULED: ${{ secrets.REPORT_RECIPIENTS_SCHEDULED }}
      REPORT_RECIPIENTS_30MIN: ${{ secrets.REPORT_RECIPIENTS_30MIN }}
      REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}

      # Build 5.19.4: scheduled editions always perform a fresh comprehensive
      # scan and verify every discovered candidate. Legacy candidate/verify
      # caps are intentionally not used here.
      FORCE_SCHEDULED_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send || false }}

      # V8.0 research / archive / template controls.
      MIN_RESEARCH_DWELL_SECONDS: ${{ vars.MIN_RESEARCH_DWELL_SECONDS || '1200' }}
      CONSOLIDATED_ARCHIVE_FILE: ${{ vars.CONSOLIDATED_ARCHIVE_FILE }}
      V8_TEMPLATE_FILE: ${{ vars.V8_TEMPLATE_FILE || 'DoS_ISRO_Media_Report_V7_0_Template.docx' }}
      PUBLISHER_RSS_URLS: ${{ vars.PUBLISHER_RSS_URLS }}

      # Optional free hosted open-model analysis. Missing/failed providers are skipped.
      ENABLE_FREE_LLM_ANALYSIS: ${{ vars.ENABLE_FREE_LLM_ANALYSIS || '1' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_MODEL: ${{ vars.CLOUDFLARE_AI_MODEL || '@cf/google/gemma-4-26b-a4b-it' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install LibreOffice for DOCX to PDF conversion
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation poppler-utils
          libreoffice --version

      - name: Validate scheduled-report configuration
        shell: bash
        run: |
          set -u
          missing=0
          for f in scheduled_media_reports.py DoS_ISRO_Master_Query_Version_8_0.txt test_build6_v8.py; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              missing=1
            fi
          done
          if ! grep -q "VERSION 8.0" DoS_ISRO_Master_Query_Version_8_0.txt; then
            echo "::error::Master Query file is not Version 8.0."
            missing=1
          fi
          if [ -z "${SMTP_EMAIL:-}" ] || [ -z "${SMTP_APP_PASSWORD:-}" ]; then
            echo "::error::SMTP_EMAIL / SMTP_APP_PASSWORD are required."
            missing=1
          fi
          RECIPIENTS="${REPORT_RECIPIENTS_SCHEDULED:-}${REPORT_RECIPIENTS_30MIN:-}${REPORT_RECIPIENTS:-}"
          if [ -z "$RECIPIENTS" ]; then
            echo "::error::No report recipient secret is configured."
            missing=1
          fi
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::warning::SUPABASE_URL is not configured. Reports can run, but delivery dedup/persistence will be unavailable."
          fi
          if [ -z "${CONSOLIDATED_ARCHIVE_FILE:-}" ]; then
            echo "::warning::CONSOLIDATED_ARCHIVE_FILE is not configured. V8 historical article dedup cannot be confirmed; delivery may be PROVISIONAL."
          elif [ ! -f "${CONSOLIDATED_ARCHIVE_FILE}" ]; then
            echo "::warning::Configured consolidated archive is not present in the repository: ${CONSOLIDATED_ARCHIVE_FILE}"
          fi
          if [ ! -f "${V8_TEMPLATE_FILE:-DoS_ISRO_Media_Report_V7_0_Template.docx}" ]; then
            echo "::warning::Original V7 template is unavailable. Build 6.0 will reproduce the specified seven-column V8 style programmatically."
          fi
          if [ -z "${GROQ_API_KEY:-}" ] && [ -z "${OPENROUTER_API_KEY:-}" ] && { [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; }; then
            echo "::warning::No free LLM provider configured. Scheduled reports will use local ISRO rules only."
          else
            echo "Free semantic-analysis chain is configured; unavailable providers will be skipped automatically."
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Run Build 6.0 V8 offline smoke checks
        shell: bash
        run: python test_build6_v8.py

      - name: Determine scheduled edition
        id: edition
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "edition=${{ inputs.edition }}" >> "$GITHUB_OUTPUT"
            echo "report_date=${{ inputs.report_date }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Scheduled runs: distinguish by UTC cron expression.
          if [ "${{ github.event.schedule }}" = "30 2 * * *" ]; then
            echo "edition=morning" >> "$GITHUB_OUTPUT"
          else
            echo "edition=evening" >> "$GITHUB_OUTPUT"
          fi
          echo "report_date=" >> "$GITHUB_OUTPUT"

      - name: Generate and email Morning or Evening edition
        shell: bash
        run: |
          args=(--edition "${{ steps.edition.outputs.edition }}")
          if [ -n "${{ steps.edition.outputs.report_date }}" ]; then
            args+=(--report-date "${{ steps.edition.outputs.report_date }}")
          fi
          python scheduled_media_reports.py "${args[@]}"

      - name: Publish report summary
        if: always()
        shell: bash
        run: |
          echo "## Scheduled DoS / ISRO Media Reports" >> "$GITHUB_STEP_SUMMARY"
          echo "- Completed (IST): $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S %Z')" >> "$GITHUB_STEP_SUMMARY"
          echo "- Each edition is emailed independently with its matching DOCX + PDF." >> "$GITHUB_STEP_SUMMARY"
          echo "- Weekly automatic delivery is paused under Master Query V8.0; weekly remains available only by explicit manual dispatch." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          find output -maxdepth 1 -type f -printf '%f\n' | sort | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Preserve generated scheduled reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dos-isro-scheduled-reports-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
