name: DoS-ISRO Build 6.1 V10.3 Media Reports - 06:05 18:05 IST

on:
  schedule:
    # GitHub cron is UTC. 00:35 UTC = 06:05 IST; 12:35 UTC = 18:05 IST.
    - cron: "35 0 * * *"
    - cron: "35 12 * * *"

  workflow_dispatch:
    inputs:
      edition:
        description: "Edition to generate"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - evening
          - weekly
      report_date:
        description: "Optional IST report date YYYY-MM-DD (blank = today IST)"
        required: false
        default: ""
        type: string
      force_send:
        description: "Resend even if this edition was already emailed"
        required: false
        default: false
        type: boolean

concurrency:
  group: dos-isro-v103-single-sequential-report
  cancel-in-progress: false

jobs:
  scheduled-report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    env:
      TZ: Asia/Kolkata
      OUTPUT_DIR: output
      MASTER_QUERY_FILE: DoS_ISRO_Master_Query_Version_10_3.txt

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}

      # Preferred recipient list for both the News Detection List and final report.
      # Fallbacks are retained for compatibility with older deployments.
      REPORT_RECIPIENTS_SCHEDULED: ${{ secrets.REPORT_RECIPIENTS_SCHEDULED }}
      REPORT_RECIPIENTS_30MIN: ${{ secrets.REPORT_RECIPIENTS_30MIN }}
      REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}

      FORCE_SCHEDULED_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send || false }}

      # V10.3 designated read-only archive. A later explicit repository variable overrides this baseline.
      REPORT_TEMPLATE_FILE: ${{ vars.REPORT_TEMPLATE_FILE || 'DoS_ISRO_Media_Report_V7_0_Template.docx' }}
      PUBLISHER_RSS_URLS: ${{ vars.PUBLISHER_RSS_URLS }}
      ENABLE_REMARKS_EXCEPTIONS: ${{ vars.ENABLE_REMARKS_EXCEPTIONS || '0' }}

      # Optional free hosted semantic-analysis chain; local rules remain final fallback.
      ENABLE_FREE_LLM_ANALYSIS: ${{ vars.ENABLE_FREE_LLM_ANALYSIS || '1' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_MODEL: ${{ vars.CLOUDFLARE_AI_MODEL || '@cf/google/gemma-4-26b-a4b-it' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install LibreOffice and PDF render tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation poppler-utils
          libreoffice --version

      - name: Validate V10.3 configuration
        shell: bash
        run: |
          set -u
          missing=0
          for f in scheduled_media_reports.py DoS_ISRO_Master_Query_Version_10_3.txt test_build61_v103.py; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              missing=1
            fi
          done
          if ! grep -q "VERSION 10.3" DoS_ISRO_Master_Query_Version_10_3.txt || ! grep -q "SINGLE SEQUENTIAL DAILY EXECUTION" DoS_ISRO_Master_Query_Version_10_3.txt; then
            echo "::error::Master Query file is not the V10.3 single sequential contract."
            missing=1
          fi
          if [ -z "${SMTP_EMAIL:-}" ] || [ -z "${SMTP_APP_PASSWORD:-}" ]; then
            echo "::error::SMTP_EMAIL / SMTP_APP_PASSWORD are required."
            missing=1
          fi
          RECIPIENTS="${REPORT_RECIPIENTS_SCHEDULED:-}${REPORT_RECIPIENTS_30MIN:-}${REPORT_RECIPIENTS:-}"
          if [ -z "$RECIPIENTS" ]; then
            echo "::error::No report recipient secret is configured."
            missing=1
          fi
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::warning::SUPABASE_URL is not configured. Report generation can continue; Supabase persistence/delivery dedup will be unavailable."
          fi
          if [ ! -f "latest-archive.csv" ]; then
            echo "::warning::latest-archive.csv is unavailable in the repository root; historical archive deduplication cannot be certified."
          else
            echo "Using read-only archive: latest-archive.csv"
          fi
          if [ ! -f "${REPORT_TEMPLATE_FILE}" ]; then
            echo "::warning::Approved DOCX template unavailable. Fixed seven-column V10.3 layout will be reproduced programmatically."
          fi
          if [ -z "${GROQ_API_KEY:-}" ] && [ -z "${OPENROUTER_API_KEY:-}" ] && { [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; }; then
            echo "::warning::No free LLM provider configured. Local ISRO-perspective rules will be used."
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Run V10.3 offline regression checks
        shell: bash
        run: python test_build61_v103.py

      - name: Determine edition
        id: edition
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "edition=${{ inputs.edition }}" >> "$GITHUB_OUTPUT"
            echo "report_date=${{ inputs.report_date }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.schedule }}" = "35 0 * * *" ]; then
            echo "edition=morning" >> "$GITHUB_OUTPUT"
          else
            echo "edition=evening" >> "$GITHUB_OUTPUT"
          fi
          echo "report_date=" >> "$GITHUB_OUTPUT"

      - name: Execute complete V10.3 sequential run
        shell: bash
        run: |
          args=(--edition "${{ steps.edition.outputs.edition }}")
          report_date="${{ steps.edition.outputs.report_date }}"
          if [ -n "$report_date" ]; then
            args+=(--report-date "$report_date")
          fi
          python scheduled_media_reports.py "${args[@]}"

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          echo "## DoS / ISRO V10.3 Daily Media Report" >> "$GITHUB_STEP_SUMMARY"
          echo "- Completed (IST): $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S %Z')" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scheduled runs: 06:05 IST Morning and 18:05 IST Evening." >> "$GITHUB_STEP_SUMMARY"
          echo "- Each run is a single sequential research → verification → dedup → classification/sort → detection email → official-source check → DOCX/PDF/XLSX → QA → final email flow." >> "$GITHUB_STEP_SUMMARY"
          echo "- Weekly workflow remains unchanged/manual as previously configured." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          find output -type f -printf '%p\n' | sort | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Preserve reports, source register, ledger and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dos-isro-v103-media-report-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
